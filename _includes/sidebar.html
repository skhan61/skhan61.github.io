<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <h1>
        <a href="{{ '/' | relative_url }}">
          {{ site.title }}
        </a>
      </h1>
      <p class="lead">{{ site.description }}</p>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">About</a>
      <a class="sidebar-nav-item{% if page.url == '/cv/' %} active{% endif %}" href="{{ '/cv/' | relative_url }}">CV</a>
      <a class="sidebar-nav-item{% if page.url == '/blog/' or page.layout == 'post' %} active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a>
      <a class="sidebar-nav-item" href="{{ site.github_profile }}">GitHub</a>
    </nav>

    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</div>
