# Build the site the way GitHub Pages does (github-pages gem, remote theme) and
# check the result with html-proofer. Pages itself still deploys from main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
      PAGES_REPO_NWO: ${{ github.repository }}
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3" # GitHub Pages uses 3.3.4; runners only ship the latest 3.3.x
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build --strict_front_matter
      # External links are not checked, so third-party sites cannot fail CI.
      # --allow-missing-href: Hydejack's own templates have <a> tags filled in by JavaScript.
      # --no-enforce-https: the shipped license texts link to http:// pages.
      - name: Check links, images and scripts
        run: bundle exec htmlproofer _site --disable-external --checks Links,Images,Scripts --allow-missing-href --no-enforce-https
