---
layout: default
title: Blog
---

<div class="posts">
  {% if site.posts.size == 0 %}<p>No posts yet.</p>{% endif %}
  {% for post in site.posts %}
  <div class="post">
    <h1 class="post-title">
      <a href="{{ post.url | relative_url }}">
        {{ post.title }}
      </a>
    </h1>

    <span class="post-date">{{ post.date | date_to_string }}</span>

    {{ post.excerpt }}
  </div>
  {% endfor %}
</div>
